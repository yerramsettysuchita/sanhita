name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Tests
        env:
          # Certification signs over canonical bytes and refuses to run without
          # a key. This one is for CI only and signs nothing that leaves CI.
          SANHITA_SIGNING_KEY: ci-only-not-a-production-key
        run: pytest -q

      # Three circulars are committed now: the stock broker master circular the
      # product is a view of, and the two Investment Adviser editions the
      # amendment comparison needs. So most of what used to skip in CI now runs.
      # The rest still skip rather than fail, and this reports how many.
      - name: Report what CI could not run
        if: always()
        env:
          SANHITA_SIGNING_KEY: ci-only-not-a-production-key
        run: |
          echo "Tests requiring the corpus PDF are skipped in CI."
          pytest -q -rs 2>&1 | tail -20

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, deliberately.
      #
      # This said `pip install ruff` and linted with whatever defaults the
      # newest release carried. Ruff 0.16 widened its default rule set and the
      # build went from clean to 443 findings with no change to this project,
      # which is a build that fails on somebody else's release schedule. The
      # rule set itself is declared in pyproject under [tool.ruff.lint].
      - run: pip install ruff==0.16.3
      - run: ruff check src tests
